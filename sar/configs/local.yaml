# LOCAL / OFFLINE smoke-test configuration.  No API keys, no downloads, no Pinecone.
# Uses a deterministic *lexical hashing* embedder, a rule-based fake LLM and the offline
# stand-in MIGRES loop.  It validates the installation and the SAR scoring/loop plumbing only;
# its outputs have no scientific meaning.
embedding:
  type: hashing
  hashing_dim: 256
  embed_template: "{title}. {text}"
vector_store:
  type: local
sar:
  alpha: 0.4
  beta: 0.3
  gamma: 0.3
  k: 3
llm:
  provider: offline_deterministic
migres:
  backend: standin          # set to `upstream` (+ MIGRES_REPO_DIR) to run the official code offline
  reranker: offline_standin
  max_iter: 3
  top_k: 3
data:
  corpus_path: data/sample/corpus.jsonl
  dataset: sample
  dataset_path: data/sample/questions.jsonl
run:
  seed: 13
  name: local_smoke
  cache_root: data/cache
